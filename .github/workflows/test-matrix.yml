# Gantry's hook tests on every OS and Python version its users have.
name: test-matrix
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m pip install pytest
      - run: python -m pytest tests/hooks -q

  launcher-on-old-python:
    # The launcher must run, and warn, on a Python too old for the hooks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Old Python gets a warning, not silence
        run: |
          out=$(echo '{}' | python plugins/gantry/hooks/_launcher.py pre_bash)
          echo "$out"
          echo "$out" | grep -q "NOT enforcing"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON files parse
        run: |
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool plugins/gantry/.claude-plugin/plugin.json > /dev/null
          python -m json.tool plugins/gantry/hooks/hooks.json > /dev/null
